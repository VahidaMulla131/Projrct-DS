<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Dynamic Base Tag: Supports both GitHub Pages (/Projrct-DS/) and Local Server (/) -->
  <script>
    (function() {
      var isGhPages = window.location.hostname.indexOf('github.io') !== -1 || window.location.pathname.indexOf('/Projrct-DS') === 0;
      var base = isGhPages ? '/Projrct-DS/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>

  <!-- GitHub Pages SPA routing redirect receiver -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Centralized academic digital library for the Data Science subject and laboratory at Mohan Babu University (MBU). Access course modules, lab experiments, practical procedures, and tools.">
  <meta name="theme-color" content="#0f172a">
  <title>DATA SCIENCE SUBJECT DIGITAL LIBRARY</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f172a%22/><text y=%2265%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22%2338bdf8%22>DS</text></svg>">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Design System & Stylesheets -->
  <link rel="stylesheet" href="css/design-tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- Root Single Page Application Mount -->
  <div id="app">
    <!-- Common Header & Navbar Mount Point -->
    <div id="header-mount"></div>

    <!-- Main Content Route Mount Point -->
    <main id="main-content" role="main"></main>

    <!-- Common Footer Mount Point -->
    <div id="footer-mount"></div>
  </div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
